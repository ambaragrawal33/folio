packages:
  - apps/*
  - packages/*
engineStrict: true
strictPeerDependencies: true
autoInstallPeers: true
storeDir: .pnpm-store
allowBuilds:
  argon2: true
  mongodb-memory-server: false
  '@scarf/scarf': false
  esbuild: true
  rolldown: true
  # Optional BullMQ/msgpackr native accelerator; use its audited JS fallback.
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - nodemailer@10.0.14
  - eslint@10.12.0
  - mongoose@9.10.4
