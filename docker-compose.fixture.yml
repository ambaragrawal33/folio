# Explicit local-only writable test profile. Never a normal/demo fallback or deployment.
services:
  fixture-api:
    build: .
    profiles: [fixture]
    command: ['pnpm', '--filter', '@folio/api', 'dev']
    ports: ['127.0.0.1:3020:3000']
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/folio_local_fixture?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379/1
      WEB_ORIGIN: http://localhost:5190
      LOCAL_FIXTURE_MODE: 'true'
      DEMO_MODE: 'false'
      CACHE_NAMESPACE: folio:local-fixture
      EMAIL_TRANSPORT: mailhog
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailhog: { condition: service_started }
    volumes:
      - ./apps/api/src:/workspace/apps/api/src:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
  fixture-web:
    build: .
    profiles: [fixture]
    command: ['pnpm', '--filter', '@folio/web', 'dev', '--port', '5190']
    ports: ['127.0.0.1:5190:5190']
    environment:
      API_PROXY_TARGET: http://fixture-api:3000
    depends_on:
      fixture-api: { condition: service_healthy }
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
      - ./apps/web/public:/workspace/apps/web/public:ro
      - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts:ro
      - ./packages/design-tokens:/workspace/packages/design-tokens:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5190').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
