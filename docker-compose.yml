name: folio
services:
  mongo:
    image: mongo:8.2@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
  redis:
    image: redis:8.2-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 15
  mailhog:
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  api:
    build: .
    env_file:
      - path: .env
        required: false
    command: ['pnpm', '--filter', '@folio/api', 'dev']
    ports: ['127.0.0.1:3000:3000']
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/folio?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
      EMAIL_TRANSPORT: mailhog
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailhog: { condition: service_started }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - ./apps/api/src:/workspace/apps/api/src:ro
  web:
    build: .
    command: ['pnpm', '--filter', '@folio/web', 'dev']
    ports: ['127.0.0.1:5173:5173']
    environment:
      API_PROXY_TARGET: http://api:3000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
      - ./apps/web/public:/workspace/apps/web/public:ro
      - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts:ro
      - ./packages/design-tokens:/workspace/packages/design-tokens:ro
volumes:
  mongo-data:
  redis-data:
